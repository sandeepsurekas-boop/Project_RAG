services:
  rag:
    build: .
    ports:
      - "8000:8000"
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      RAG_API_URL: http://localhost:8000
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
      PAPERS_DIRECTORY: /app/data/papers
    volumes:
      - ./data:/app/data
    restart: unless-stopped
